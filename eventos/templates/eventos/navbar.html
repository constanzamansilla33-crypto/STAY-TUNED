<header class="encabezado">
    <a href="{% url 'inicio' %}" class="logo" id="boton-logo">STAY<span>TUNED</span></a>

    <nav class="navegacion">
        <a href="{% url 'inicio' %}" id="boton-inicio">Inicio</a>
        <a href="{% url 'inicio' %}#eventos" id="boton-eventos">Eventos</a>

        {% if user.is_authenticated %}
            <a href="{% url 'perfil' %}" class="usuario-nav">
                <span class="texto-escritorio">
                    Hola, {{ user.first_name|default:user.username }}
                </span>
                <span class="texto-movil">Mi perfil</span>
            </a>
        {% else %}
            <a href="{% url 'registro' %}">Registrarse</a>
        {% endif %}

        <button id="cambiar-tema" class="boton-tema" type="button">
            ☼
        </button>

        {% if user.is_authenticated %}
            <form method="POST" action="{% url 'logout' %}">
                {% csrf_token %}

                <button type="submit" class="boton-logout"
                        aria-label="Cerrar sesión" title="Cerrar sesión">

                    <span class="texto-escritorio">Cerrar sesión</span>

                    <span class="texto-movil" aria-hidden="true">
                        <svg width="18" height="18" viewBox="0 0 24 24"
                             fill="none" stroke="currentColor"
                             stroke-width="2" stroke-linecap="round"
                             stroke-linejoin="round">
                            <path d="M10 17l5-5-5-5"/>
                            <path d="M15 12H3"/>
                            <path d="M14 3h5a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-5"/>
                        </svg>
                    </span>

                </button>
            </form>
        {% endif %}
    </nav>
</header>
