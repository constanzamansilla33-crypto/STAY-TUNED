{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block titulo %}STAY TUNED{% endblock %}</title>

    <link rel="manifest" href="{% static 'eventos/manifest.json' %}">
    <meta name="theme-color" content="#0B0B0F">
    <link rel="stylesheet" href="{% static 'eventos/css/style.css' %}?v=4">
</head>

<body>

    {% include "eventos/navbar.html" %}

    <main class="{% block clase_main %}{% endblock %}">
        {% block contenido %}
        {% endblock %}
    </main>

    {% include "eventos/footer.html" %}

    <script>
        const botonTema = document.getElementById("cambiar-tema");
        const temaGuardado = localStorage.getItem("tema");

        if (temaGuardado === "claro") {
            document.documentElement.setAttribute("data-tema", "claro");

            if (botonTema) {
                botonTema.textContent = "☾";
            }
        }

        if (botonTema) {
            botonTema.addEventListener("click", function () {
                const temaActual = document.documentElement.getAttribute("data-tema");

                if (temaActual === "claro") {
                    document.documentElement.removeAttribute("data-tema");
                    botonTema.textContent = "☼";
                    localStorage.setItem("tema", "oscuro");
                } else {
                    document.documentElement.setAttribute("data-tema", "claro");
                    botonTema.textContent = "☾";
                    localStorage.setItem("tema", "claro");
                }
            });
        }
    </script>

    <script>
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", function () {
                navigator.serviceWorker.register("{% url 'service_worker' %}")
                    .catch(function (error) {
                        console.error(error);
                    });
            });
        }
    </script>

    {% block scripts %}
    {% endblock %}

</body>
</html>
